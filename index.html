<!DOCTYPE html><html lang="fa" dir="rtl" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نوید کاپ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f9ff;--card:#fff;--tx:#0a2540;--mut:#5b7191;--ln:#dbe8f6;--b:#1456d6;--b2:#0a2f7a;--g:#12b76a;--hi:#e8f1ff;--in:#f1f6fd;--p:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06122b;--card:#0d2147;--tx:#eef5ff;--mut:#8fa8cc;--ln:#1b3566;--hi:#122a58;--in:#0a1a3a}}
:root[data-theme="dark"]{--bg:#06122b;--card:#0d2147;--tx:#eef5ff;--mut:#8fa8cc;--ln:#1b3566;--hi:#122a58;--in:#0a1a3a}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
button{font:inherit}
.tr{position:absolute;top:50%;left:-50px;font-size:26px;pointer-events:none;animation:tr 7s ease-in-out infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}@keyframes tr{0%{left:-50px;transform:translateY(-50%) rotate(-40deg) scale(.6)}30%{left:42%;transform:translateY(-90%) rotate(0) scale(1.15)}40%{transform:translateY(-50%) rotate(0) scale(1)}55%{left:42%;transform:translateY(-50%) rotate(10deg) scale(1.1)}100%{left:110%;transform:translateY(-50%) rotate(40deg) scale(.6)}}@media(prefers-reduced-motion:reduce){.tr{display:none}}
header{overflow:hidden;position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--b2),var(--b));color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(10,47,122,.35);cursor:pointer}
header img{width:34px;height:34px;border-radius:50%;background:#fff}
header b{font-size:24px;font-weight:900}header span{font-size:12px;opacity:.8}
header i{margin-right:auto;font-style:normal;background:var(--g);border-radius:99px;padding:1px 12px;font-size:12px;font-weight:700}
#rail{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:8px;padding:8px 6px;background:var(--card);border:1px solid var(--ln);border-right:0;border-radius:18px 0 0 18px;box-shadow:-4px 4px 18px rgba(10,47,122,.18)}
#rail button{width:44px;height:44px;border:0;border-radius:14px;background:var(--hi);font-size:22px;cursor:pointer;position:relative;transition:.25s}
#rail button.on{background:var(--b);box-shadow:0 0 0 3px rgba(18,183,106,.45)}
#rail small{position:absolute;right:52px;top:50%;transform:translateY(-50%) translateX(14px);background:var(--b2);color:#fff;font-size:12px;white-space:nowrap;padding:2px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s}
#rail button:hover small{opacity:1;transform:translateY(-50%)}
.tk{background:var(--g);color:#fff;overflow:hidden;white-space:nowrap;font-weight:700;font-size:13px;padding:5px 0;position:relative;z-index:3}
.tk div{display:inline-block;animation:mq 30s linear infinite;will-change:transform}
.tk span{margin:0 22px}@keyframes mq{to{transform:translateX(50%)}}
main{max-width:880px;margin:auto;padding:0 62px 100px 14px;position:relative;z-index:2}
#ld{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--b2),var(--b) 55%,var(--g));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;font-weight:900;font-size:22px;opacity:0;pointer-events:none;transition:opacity .45s}
#ld.on{opacity:1;pointer-events:all}
#ld img{width:130px;height:130px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.25),0 12px 40px rgba(0,0,0,.35);animation:sp 1.1s cubic-bezier(.5,0,.3,1) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ld u{text-decoration:none;display:block;width:150px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
#ld u:after{content:"";display:block;height:100%;width:40%;background:#fff;border-radius:9px;animation:ln 1s ease-in-out infinite}
@keyframes ln{from{transform:translateX(160%)}to{transform:translateX(-160%)}}
.hero{margin-top:18px;border-radius:26px;background:linear-gradient(135deg,var(--b2),var(--b) 60%,#1d8fe8);color:#fff;padding:26px 18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.06) 46px 92px)}
.hero:after{content:"";position:absolute;left:-60px;bottom:-60px;width:220px;height:220px;border:3px solid rgba(255,255,255,.2);border-radius:50%}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(40px,12vw,68px);font-weight:900;line-height:1.1}.hero h1 em{font-style:normal;color:#7dffc0}
.hero p{margin:6px 0 16px;opacity:.9;font-weight:700}
.nx{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:18px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:900;font-size:17px}
.nx s{text-decoration:none;background:var(--g);border-radius:99px;padding:0 12px;font-size:13px}
.nx small{grid-column:1/4;font-weight:400;font-size:12px;opacity:.85}
.pt4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pc{border:0;border-radius:22px;color:#fff;padding:20px 8px;text-align:center;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .2s}
.pc:active{transform:translateY(4px)}.pc i{display:block;font-style:normal;font-size:44px}.pc small{display:block;font-weight:400;font-size:12px;opacity:.9}
section{margin-top:30px}
h2{margin:0 0 12px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:24px;border-radius:4px;background:linear-gradient(var(--g),var(--b));flex:none}
.rv{opacity:0;transform:translateX(calc(40px + var(--p)*140px));transition:opacity .7s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fx,.mem{grid-template-columns:1fr!important}}
.mc{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;position:relative;overflow:hidden}
.mc:before{content:"";position:absolute;top:0;right:0;width:5px;height:100%;background:var(--c,var(--b))}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;text-align:center;font-weight:700;align-items:center;font-size:14px}
.vs{background:var(--hi);color:var(--b);border-radius:99px;padding:0 9px;font-weight:900;font-size:12px}
.wh{margin-top:6px;text-align:center;font-size:12px;color:var(--mut);display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.in{font-size:16px;background:var(--in);color:inherit;border:1px solid var(--ln);border-radius:8px;padding:5px 6px;font:inherit;width:100%;min-width:0}
.mr .in{padding:3px 4px;font-size:14px}.wh .in{width:44%;font-size:13px}
.num{width:52px;text-align:center;padding:4px 2px}input[type=checkbox]{width:24px;height:24px}
.tw{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow-x:auto;margin-bottom:12px}
.gt{font-weight:900;color:var(--b);padding:8px 14px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--mut);font-weight:700;padding:8px 5px;white-space:nowrap}
td{padding:7px 5px;text-align:center;border-top:1px solid var(--ln)}
td:nth-child(2){text-align:right;font-weight:700;min-width:110px}
tr.q td:first-child{box-shadow:inset -4px 0 var(--g)}.pt{font-weight:900;color:var(--b)}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem div{background:var(--card);border:1px solid var(--ln);border-right:5px solid var(--g);border-radius:14px;padding:10px;font-size:13px;white-space:pre-wrap}.mem b{display:block;color:var(--g)}
textarea.in{height:80px;resize:vertical}
.box{background:var(--card);border:1px solid var(--ln);padding:14px;border-radius:18px;display:grid;gap:12px}
.box label{font-weight:700;font-size:14px;display:grid;gap:4px}
.btn{border:0;border-radius:14px;padding:12px;color:#fff;font-weight:900;cursor:pointer;background:linear-gradient(90deg,var(--b),var(--g));font-size:16px}
.btn:disabled{opacity:.6}
.empty{text-align:center;color:var(--mut);padding:14px}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln);z-index:12}
.bar .btn{padding:9px 16px;font-size:14px}
.eb{background:#fef3c7;color:#92400e;margin:12px 0 0;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:700}
.clr{border:0;border-radius:10px;background:#fee2e2;color:#b91c1c;font-size:12px;padding:3px 10px;cursor:pointer;margin-right:auto}
.sp{display:flex;gap:8px;overflow-x:auto;margin-top:16px}
.sp button{flex:1;white-space:nowrap;border:2px solid var(--c);background:none;color:var(--c);border-radius:14px;padding:7px 10px;font-weight:700;cursor:pointer}.sp .on{background:var(--c);color:#fff}
.pk{cursor:pointer;transition:.2s}.pk.on{outline:3px solid var(--g);transform:scale(1.02)}
.wb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wb button{border:2px solid var(--ln);background:var(--in);color:var(--tx);border-radius:14px;padding:12px 4px;font-weight:900;cursor:pointer}.wb .on{border-color:var(--g);background:var(--g);color:#fff}
.wb .dr{grid-column:1/3}
.st{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900}.st button{width:38px;height:38px;border:0;border-radius:50%;background:var(--b);color:#fff;font-size:22px;cursor:pointer}.st b{font-size:30px;min-width:30px;text-align:center}
.tl{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--ln);padding:4px 0}
.cr{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}.cr .mc{flex:0 0 80%;scroll-snap-align:center;color:var(--tx)}.cr .hd{font-size:12px;font-weight:900;color:var(--c);margin-bottom:6px;text-align:center}.hh{font-weight:900;margin:0 0 6px;font-size:15px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--in);border-radius:14px;padding:8px 10px}.sr span{font-weight:700;flex:1;min-width:0}.sr .c{display:flex;align-items:center;gap:6px}.sr button{width:50px;height:50px;border:0;border-radius:14px;background:var(--b);color:#fff;font-size:30px;font-weight:900;cursor:pointer;touch-action:manipulation}.sr b{font-size:32px;min-width:40px;text-align:center}
.cf{position:fixed;top:-30px;z-index:60;font-size:26px;pointer-events:none;animation:cf 2.2s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;z-index:70}
.bkw{direction:ltr;overflow-x:auto;padding-bottom:8px}.bkg{direction:ltr;display:flex;align-items:center;gap:4px;min-width:470px}.bkg.ed{min-width:640px}
.sd{flex:1;min-width:0;display:flex;align-items:center}.sd.rv2{flex-direction:row-reverse}
.pr{display:flex;flex-direction:column;gap:16px;flex:1.7;min-width:0}
.cn{width:12px;height:50px;border:2px solid #94a3b8;border-left:0;position:relative;flex:none}.cn:after{content:"";position:absolute;right:-12px;top:50%;width:12px;border-top:2px solid #94a3b8}
.rv2 .cn{border-left:2px solid #94a3b8;border-right:0}.rv2 .cn:after{right:auto;left:-12px}
.sl{direction:rtl;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:0 7px;height:34px;font-size:12px;font-weight:700;overflow:hidden}
.sl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl b{background:var(--in);border-radius:6px;min-width:18px;text-align:center;flex:none}
.sl.win{border-color:var(--g);color:var(--g)}.sl .in{height:26px;padding:0 4px;font-size:13px}.sl .in.num{width:44px;flex:none}
.wn{flex:1.2;min-width:0;margin:0 12px;border-color:#f59e0b}
.ct{flex:0 0 21%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.ed .ct{flex-basis:26%}
.fl{font-size:11px;font-weight:900;color:var(--mut)}.ch{font-size:11px;font-weight:900;color:#d97706}.th{width:100%;display:grid;gap:4px}
input.wc,input.lc{-webkit-appearance:none;appearance:none;width:26px;height:26px;border:2px solid var(--ln);border-radius:8px;background:var(--in);position:relative;cursor:pointer;margin:0}
input.wc:checked{border-color:var(--g);background:#dcfce7}input.lc:checked{border-color:#dc2626;background:#fee2e2}
input.wc:checked:after,input.lc:checked:after{position:absolute;inset:0;text-align:center;font-weight:900;font-size:18px;line-height:22px}input.wc:checked:after{content:"✓";color:var(--g)}input.lc:checked:after{content:"✕";color:#dc2626}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}#fx span{position:absolute;font-size:30px;will-change:transform}
.ft{text-align:center;direction:ltr;font-size:11px;color:var(--mut);padding:20px 0}
@media(prefers-reduced-motion:reduce){.tk div,#ld img{animation:none}.rv{opacity:1;transform:none}}

 return matches('football')+`<section><h2>📊 جدول رده‌بندی${edit?`<button class="clr" onclick="clr2('football')">🧹 پاک کردن نتایج</button>`:''}</h2>${tbl(0)}${tbl(1)}${edit?'<button class="btn" onclick="render()">🔄 محاسبه امتیازها</button>':''}</section>${bracket()}<section><h2>👥 اعضای تیم‌ها</h2><div class="mem">${mem||'<p class="empty">هنوز ثبت نشده</p>'}</div></section>`}
function qual(g){return D.football.T.slice(g*5,g*5+5).filter(t=>t.n.trim()).map(t=>{const w=+t.w||0,d=+t.d||0,l=+t.l||0,gf=+t.gf||0,ga=+t.ga||0;return{n:t.n.trim(),pl:w+d+l,gd:gf-ga,pt:w*3+d,gf}}).filter(x=>x.pl>0).sort((a,b)=>b.pt-a.pt||b.gd-a.gd||b.gf-a.gf).map(x=>x.n)}
function bracket(){
 const K=D.football.k,A=qual(0),B=qual(1),v=(m,s)=>(K[m][s]||'').trim(),sc=(m,s)=>K[m][s]===''?null:+K[m][s];
 const P0={sf1:[A[0],B[1]],sf2:[B[0],A[1]]},sn=(m,i)=>v(m,'ab'[i])||(P0[m][i]||'');
 const W=m=>{const x=sc(m,'x'),y=sc(m,'y'),a=sn(m,0),b=sn(m,1);return x==null||y==null||x===y||!a||!b?['','']:x>y?[a,b]:[b,a]};
 const w1=W('sf1'),w2=W('sf2'),PH={...P0,fin:[w1[0],w2[0]],thr:[w1[1],w2[1]]},show=(m,i)=>v(m,'ab'[i])||PH[m][i]||'';
 const slot=(m,i,c='')=>{const s='ab'[i],t='xy'[i],p=`football.k.${m}.`,o=sc(m,'xy'[1-i]),me=sc(m,t),win=me!=null&&o!=null&&me>o;
  return `<div class="sl${win?' win':''} ${c}">`+(edit?`<input class="in" data-p="${p+s}" value="${esc(K[m][s])}" placeholder="${esc(PH[m][i]||'تیم')}"><input class="in num" type="number" min="0" data-p="${p+t}" value="${esc(K[m][t])}">`:`<span>${esc(show(m,i))||'؟'}</span><b>${me==null?'':me}</b>`)+'</div>'};
 const side=(sm,fi,rv)=>`<div class="sd${rv?' rv2':''}"><div class="pr">${slot(sm,0)}${slot(sm,1)}</div><div class="cn"></div>${slot('fin',fi,'wn')}</div>`;
 const fx=sc('fin','x'),fy=sc('fin','y'),ch=fx==null||fy==null||fx===fy?'':fx>fy?show('fin',0):show('fin',1);
 return `<section><h2>🏅 مرحله‌ی حذفی</h2><p class="empty" style="padding:0 0 8px">دو تیم برتر هر گروه صعود می‌کنند.${edit?' اسم‌ها خودکار پر می‌شود، دستی هم می‌توانی بنویسی.':''}</p><div class="bkw rv"><div class="bkg${edit?' ed':''}">${side('sf1',0,0)}<div class="ct"><div style="font-size:36px">🏆</div><div class="fl">فینال</div>${ch?`<div class="ch">قهرمان: ${esc(ch)}</div>`:''}<div class="th"><div class="fl">🥉 رده‌بندی</div>${slot('thr',0)}${slot('thr',1)}</div></div>${side('sf2',1,1)}</div></div></section>`}
function small(k){const s=SP[k];let r=D[k].T.map((t,i)=>({t,i}));if(!edit)r=r.filter(x=>x.t.n.trim()).sort((a,b)=>(+b.t.w||0)-(+a.t.w||0)||(+a.t.l||0)-(+b.t.l||0));
 const rows=r.map((x,j)=>{const p=k+'.T.'+x.i+'.';return `<tr><td>${j+1}</td><td>${!edit&&k==='pingpong'&&j<3&&((+x.t.g||0)+(+x.t.w||0)+(+x.t.l||0))>0?['🥇','🥈','🥉'][j]+' ':''}${fl(p+'n','نام')}</td><td>${nm(p+'g')}</td><td>${nm(p+'w')}</td><td>${nm(p+'l')}</td></tr>`}).join('');
 return matches(k)+`<section><h2>🏆 جدول ${s.n}${edit?`<button class="clr" onclick="clr2('${k}')">🧹 پاک کردن نتایج</button>`:''}</h2><div class="tw rv"><table><tr><th>#</th><th>${k==='pingpong'?'بازیکن':'تیم'}</th><th>تعداد بازی</th><th>برد</th><th>باخت</th></tr>${rows||'<tr><td colspan=5>هنوز ثبت نشده</td></tr>'}</table></div></section>`}
function home(){const u=up(),n=u[0];
 return `<div class="hero rv"><h1>نوید <em>کاپ</em></h1><p>مسابقات مدرسه · دبیرستان دوره دوم نوید صالحین</p><div class="hh">🔥 بازی‌های بعدی</div><div class="cr">${['football','foosball','pingpong'].flatMap(k=>D[k].m.filter(m=>m.a.trim()&&m.b.trim()).slice(0,1).map(m=>`<div class="mc" style="--c:${SP[k].c}"><div class="hd">${SP[k].e} ${SP[k].n}</div><div class="mr"><span>${esc(m.a)}</span><span class="vs">VS</span><span>${esc(m.b)}</span></div><div class="wh">📅 ${esc(m.d)||'بزودی'} ${m.t.trim()?'· ⏰ '+esc(m.t):''}</div></div>`)).join('')||'<p class="empty">هنوز بازی‌ای ثبت نشده</p>'}</div></div>
 <div class="pt4">${Object.keys(SP).map(k=>`<button class="pc rv" style="background:linear-gradient(135deg,${SP[k].c},${SP[k].c}bb)" onclick="go('${k}')"><i>${SP[k].e}</i>${SP[k].n}<small>ورود ‹</small></button>`).join('')}<button class="pc rv" style="background:linear-gradient(135deg,#12b76a,#1456d6)" onclick="go('predict')"><i>🔮</i>پیش‌بینی<small>نتیجه را حدس بزن!</small></button></div>
 <section><h2>⏳ بازی‌های پیش رو</h2><div class="fx">${u.map(m=>`<div class="mc rv" style="--c:${SP[m.k].c}"><div class="mr"><span>${esc(m.a)}</span><span class="vs">${SP[m.k].e}</span><span>${esc(m.b)}</span></div><div class="wh">📅 ${esc(m.d)||'بزودی'} ${m.t.trim()?'· ⏰ '+esc(m.t):''}</div></div>`).join('')||'<p class="empty">هنوز بازی‌ای ثبت نشده</p>'}</div></section>`}
function predict(){
 const ms=D[P.s].m.map((m,i)=>({...m,i})).filter(m=>m.a.trim()&&m.b.trim()),m=ms.find(x=>x.i===P.mi),s=SP[P.s],fb=P.s==='football';
 const tabs=Object.keys(SP).map(k=>`<button class="${k===P.s?'on':''}" style="--c:${SP[k].c}" onclick="P.s='${k}';P.mi=-1;P.win='';render()">${SP[k].e} ${SP[k].n}</button>`).join('');
 const my=lsGet();
 return (edit?`<div class="box" style="margin-top:14px"><b>⚙️ مقصد ارسال پیش‌بینی‌ها</b><label>ایمیل (جیمیل)<input class="in" data-p="contact.email" value="${esc(D.contact.email)}" placeholder="example@gmail.com" dir="ltr"></label><label>شماره (با کد کشور)<input class="in" data-p="contact.phone" value="${esc(D.contact.phone)}" placeholder="98912xxxxxxx" dir="ltr"></label><label>Access Key از web3forms.com (آخر کار)<input class="in" data-p="contact.key" value="${esc(D.contact.key)}" placeholder="xxxxxxxx-xxxx-..." dir="ltr"></label></div>`:'')+`<div class="eb" style="background:var(--hi);color:var(--b)">🔮 بازی را انتخاب کن، برنده را حدس بزن و ارسال کن!</div><div class="sp">${tabs}</div><section style="margin-top:14px"><div class="fx" style="--c:${s.c}">${ms.map(x=>`<div class="mc pk${x.i===P.mi?' on':''}" onclick="P.mi=${x.i};P.win='';render()"><div class="mr"><span>${esc(x.a)}</span><span class="vs">VS</span><span>${esc(x.b)}</span></div><div class="wh">📅 ${esc(x.d)} ⏰ ${esc(x.t)}</div></div>`).join('')||'<p class="empty">بازی‌ای برای این رشته ثبت نشده 🙂</p>'}</div></section>`+
 (m?`<div class="box" style="margin-top:14px"><b>برنده کیست؟</b><div class="wb">${[m.a,m.b].map(x=>`<button class="${P.win===x?'on':''}" onclick="P.win=this.dataset.w;render()" data-w="${esc(x)}">${esc(x)}</button>`).join('')}${fb?`<button class="dr ${P.win==='مساوی'?'on':''}" onclick="P.win='مساوی';render()">🤝 مساوی</button>`:''}</div>
 ${fb?`<b>گل‌های هر تیم</b>${[m.a,m.b].map((x,i)=>`<div class="sr"><span>${esc(x)}</span><div class="c"><button onclick="sg(${i+1},-1)">−</button><b id="g${i+1}">${P['g'+(i+1)]}</b><button onclick="sg(${i+1},1)">+</button></div></div>`).join('')}`:''}
 <label>اسم شما<input class="in" value="${esc(P.name)}" oninput="P.name=this.value" placeholder="نام و نام خانوادگی"></label><button class="btn" id="sb" onclick="send()">📨 ارسال پیش‌بینی</button></div>`:'')+
 (my.length?`<section><h2>📝 پیش‌بینی‌های من</h2><div class="box">${my.map(x=>`<div class="tl"><span>${esc(x.game)}</span><b>${esc(x.win)}${x.score?' ('+esc(x.score)+')':''}</b></div>`).join('')}</div></section>`:'')+
 (canEdit?`<section><h2>📥 پیش‌بینی‌های دریافتی (${PR.length})</h2><div class="box" id="pr">${prList()}</div></section>`:'')}
const prList=()=>PR.length?PR.map(x=>`<div class="tl"><span>${esc(x.name)} · ${esc(x.game)}</span><b>${esc(x.win)}${x.score?' ('+esc(x.score)+')':''}</b></div>`).join(''):'<p class="empty">هنوز پیش‌بینی‌ای نرسیده</p>';
function sg(i,d){P['g'+i]=Math.max(0,P['g'+i]+d);$('g'+i).textContent=P['g'+i]}
function lsGet(){try{return JSON.parse(localStorage.getItem('nc_my')||'[]')}catch(e){return[]}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function confetti(){for(let i=0;i<34;i++){const s=document.createElement('span');s.className='cf';s.textContent=['⚽','🎉','🏆','✨'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
async function send(){
 const m=D[P.s].m[P.mi],fb=P.s==='football';
 if(!P.name.trim()||!m||!P.win)return alert('همه‌ی قسمت‌ها را پر کنید');
 if(fb&&(P.win==='مساوی'?P.g1!==P.g2:P.win===m.a?!(P.g1>P.g2):!(P.g2>P.g1)))return alert('نتیجه با برنده‌ی انتخابی یکی نیست. برای مساوی گل‌ها باید برابر باشند و برای برنده گل‌های او بیشتر.');
 const rec={name:P.name.trim(),sport:SP[P.s].n,game:m.a.trim()+' VS '+m.b.trim()+' ('+m.d.trim()+' '+m.t.trim()+')',win:P.win,score:fb?m.a.trim()+' '+P.g1+' - '+P.g2+' '+m.b.trim():'',ts:Date.now()};
 const b=$('sb');b.disabled=true;b.textContent='⏳ در حال ارسال...';
 try{let ok=0;if(dbx){try{await dbx.collection('preds').add(rec);ok=1}catch(e){}}
  if(D.contact.key){try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:D.contact.key,subject:'پیش‌بینی نوید کاپ',from_name:'نوید کاپ',name:rec.name,sport:rec.sport,game:rec.game,winner:rec.win,score:rec.score,message:'نام: '+rec.name+'\nرشته: '+rec.sport+'\nبازی: '+rec.game+'\nبرنده: '+rec.win+(rec.score?'\nنتیجه: '+rec.score:'')})}),j=await r.json();if(j.success)ok=1}catch(e){}}
  if(!ok)throw 0;try{localStorage.setItem('nc_my',JSON.stringify([rec,...lsGet()].slice(0,20)))}catch(e){}
  confetti();toast('✅ پیش‌بینی شما ارسال شد');P.mi=-1;P.win='';P.g1=P.g2=0;render()}
 catch(e){alert('ارسال نشد، دوباره امتحان کنید');b.disabled=false;b.textContent='📨 ارسال پیش‌بینی'}}
function clr(k){if(confirm('همه‌ی بازی‌های این رشته پاک شود؟')){D[k].m=A(k==='football'?10:8,Z);render()}}
function clr2(k){if(!confirm('نتایج جدول پاک شود؟ (اسم‌ها می‌ماند)'))return;if(k==='football')D.football.k=mkK();D[k].T.forEach(t=>{if(k==='football'){t.w=t.d=t.l=t.gf=t.ga=''}else{t.w=t.l='';t.g=''}});render()}
async function save(){const a=await claude.use('artifact');if(!a)return alert('فقط مدیر صفحه می‌تواند ذخیره کند');
 const c=document.documentElement.cloneNode(true);c.querySelector('#data').textContent=JSON.stringify(D);['app','fx','tk','rail'].forEach(i=>c.querySelector('#'+i).innerHTML='');c.querySelector('#ld').className='on';c.removeAttribute('style');c.querySelectorAll('.toast,.cf').forEach(e=>e.remove());
 try{await a.publish('<!DOCTYPE html>'+c.outerHTML)}catch(e){alert('ذخیره نشد: '+(e&&e.message||e))}}
function render(){
 const f={home,predict,football,pingpong:()=>small('pingpong'),foosball:()=>small('foosball')}[pg];
 $('app').innerHTML=(edit?'<div class="eb">✏️ حالت ویرایش: روی هر کادر بزن و بنویس. در پایان «ذخیره و انتشار» را بزن تا همه تغییرات را ببینند.</div>':'')+f()+'<div class="ft">produce by Az</div>'+(canEdit?`<div class="bar">${edit?'<button class="btn" onclick="save()">💾 ذخیره و انتشار</button><button class="btn" style="background:#64748b" onclick="edit=false;location.reload()">لغو</button>':'<button class="btn" onclick="edit=true;render()">✏️ ویرایش اطلاعات</button>'}</div>`:'');
 $('tk').innerHTML=[...up(),...up()].map(x=>`<span>${SP[x.k].e} ${esc(x.a)} VS ${esc(x.b)} · ${esc(x.d)}</span>`).join('');
 [...$('rail').children].forEach((b,i)=>b.classList.toggle('on',PG[i][0]===pg));
 document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
function go(p){if(p===pg&&!$('ld').classList.contains('on')&&p!=='home')return;const l=$('ld');l.classList.add('on');setTimeout(()=>{pg=p;render();scrollTo(0,0);l.classList.remove('on')},1200)}
const io=new IntersectionObserver(a=>a.forEach(e=>{if(e.isIntersecting){e.target.style.transitionDelay=Math.random()*.25+'s';e.target.classList.add('in')}}),{threshold:.1});
$('rail').innerHTML=PG.map(s=>`<button onclick="go('${s[0]}')">${s[1]}<small>${s[2]}</small></button>`).join('');
// travelling balls: faster, more and bolder as you scroll deeper
const em=['⚽','🏓','⚽','🕹️','⚽','🏆','⚽','🏓'],B=em.map((c,i)=>{const s=document.createElement('span');s.textContent=c;$('fx').appendChild(s);return{s,y:12+i*11,o:i*140,v:.5+i*.12}});
let p=0,W=innerWidth;const t0=performance.now();
const upd=()=>{const h=document.documentElement.scrollHeight-innerHeight;p=h>0?Math.min(1,scrollY/h):0;document.documentElement.style.setProperty('--p',p.toFixed(3));$('tk').style.animationDuration=(34-p*24)+'s'};
addEventListener('scroll',upd,{passive:true});addEventListener('resize',()=>{W=innerWidth;upd()});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function f(now){const t=(now-t0)/1000;B.forEach((b,i)=>{const n=1+Math.floor(p*(B.length-1));b.s.style.display=i<n?'block':'none';const x=((t*(40+p*260)*b.v+b.o)%(W+120))-60;b.s.style.opacity=(.1+p*.3).toFixed(2);b.s.style.transform=`translate(${x}px,${b.y*innerHeight/100+Math.sin(t*2+i)*14*p}px) rotate(${x*1.5}deg)`});requestAnimationFrame(f)})(t0);
render();setTimeout(()=>$('ld').classList.remove('on'),1400);
(async()=>{try{const u=await claude.use('user');canEdit=u?await u.canEdit():false;dbx=await claude.use('db');
 if(canEdit){render();if(dbx)dbx.collection('preds').orderBy('ts','desc').onSnapshot(s=>{PR=s.docs.map(d=>d.data());const e=$('pr');if(e)e.innerHTML=prList()})}}catch(e){}})();
</script>
